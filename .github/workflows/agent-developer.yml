name: AI Studio Agent Developer

on:
  issues:
    types: [labeled]

jobs:
  run-agent:
    if: github.event.label.name == 'ai-task'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Execute Orchestrator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: node .github/scripts/run-agent.mjs

      - name: Push Branch & Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          BRANCH="ai/issue-${ISSUE_NUM}"
          
          # 1. Resolve default base branch dynamically (handles main vs master)
          DEFAULT_BRANCH=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Make sure local ref has the remote default branch to calculate divergence
          git fetch origin "$DEFAULT_BRANCH":"$DEFAULT_BRANCH"

          # 3. Create or reset the branch explicitly against the default branch
          git checkout -B "$BRANCH" "origin/$DEFAULT_BRANCH"
          
          # Stage all repository changes
          git add -A

          # Exit cleanly if no changes were generated
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "feat: automated changes for issue #${ISSUE_NUM}"
          git push -u origin "$BRANCH" --force

          # 4. Open the Pull Request against the resolved base branch
          gh pr create \
            --title "AI: ${ISSUE_TITLE}" \
            --body "Resolves #${ISSUE_NUM}. Scope handled automatically by AI Studio Orchestrator." \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH"