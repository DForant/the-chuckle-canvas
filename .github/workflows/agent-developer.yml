name: AI Studio Agent Developer

on:
  issues:
    types: [labeled]

jobs:
  run-agent:
    if: github.event.label.name == 'ai-task'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Monorepo Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi
          
      - name: Execute Orchestrator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: node .github/scripts/run-agent.mjs

      - name: Push Branch & Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          BRANCH="ai/issue-${ISSUE_NUM}"
          
          # 1. Resolve default base branch dynamically
          DEFAULT_BRANCH=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Switch to a new branch preserving the workspace file modifications
          git checkout -b "$BRANCH"
          
          # 3. Stage all modified, created, or deleted files
          git add -A

          # Exit cleanly if no modifications were made
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "feat: automated changes for issue #${ISSUE_NUM}"
          git push origin "$BRANCH" --force

          # 4. Create the Pull Request against the default branch
          gh pr create \
            --title "AI: ${ISSUE_TITLE}" \
            --body "Resolves #${ISSUE_NUM}. Scope handled automatically by AI Studio Orchestrator." \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH"